# Traces CI. GitHub-hosted ubuntu-latest runners only (free tier for public repos); no secrets, no deploys.
name: ci
on:
  push:
    branches: [build/traces-v1, "ws/**"]
  pull_request:
    branches: [build/traces-v1, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.8"

jobs:
  python:
    name: python lint, types, unit + API tests, OpenAPI currency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv python install "$PYTHON_VERSION"
      - run: uv sync --frozen
      - name: ruff
        run: uv run --frozen ruff check backend tests
      - name: mypy
        run: uv run --frozen mypy
      - name: frozen checker integrity
        run: cd backend/traces/validators/checker && sha256sum -c SHA256SUMS
      - name: unit and API tests (includes docs/contracts/openapi.json currency check)
        run: uv run --frozen pytest -q tests/unit tests/api

  web:
    name: web typecheck, API types currency, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run check:api
      - run: npm run build

  baseline:
    name: Task 002 baseline (16 contract + 8 regression tests, 4,642-edge reproduction)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv python install "$PYTHON_VERSION"
      - run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: toolchain (CodeGraph 1.6.2 + TypeScript 6.0.3, integrity-pinned, no install scripts)
        run: cd toolchain && npm ci --ignore-scripts --no-audit --no-fund
      - name: allow unprivileged user namespaces (unshare -rn isolation)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -rn true && echo "unshare available"
      - uses: actions/cache@v6
        with:
          path: .cache/targets
          key: targets-fastapi-full-stack-fastapi-template-b1125d8839482cb7bbae603ddc6d0081bf87532e
      - name: contract + regression + migration tests
        env:
          TRACES_ISOLATION: unshare
        run: uv run --frozen pytest -q tests/contract tests/regression
      - name: upload run summary on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-run
          path: |
            .traces-data/runs/*/inside_result.json
            .traces-data/runs/*/run_meta.json
          retention-days: 7
